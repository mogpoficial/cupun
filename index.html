<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupun - Validación de Cupones</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; box-sizing: border-box; }
        .valid { border-top: 6px solid #2ecc71; }
        .invalid { border-top: 6px solid #e74c3c; }
        h2 { margin-top: 10px; font-size: 22px; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
        .badge-valid { background: #e8f8f5; color: #27ae60; }
        .badge-invalid { background: #ffd2d2; color: #c0392b; }
        .code-box { background: #f8f9fa; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 8px; margin-top: 20px; font-weight: bold; color: #1e293b; }
        .btn-wa { display: inline-block; background-color: #25d366; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; margin-top: 15px; width: 100%; box-sizing: border-box; font-size: 15px; border: none; cursor: pointer; }
        .btn-wa:hover { background-color: #20ba5a; }
        .loading { font-size: 16px; color: #64748b; }
    </style>
</head>
<body>

    <div class="card" id="card-container">
        <div class="loading">Verificando estatus en Cupun...</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwTYmqvvM2uZJmLputON7DlW4nPba9QHFQIVXU38GdMe01XcfzE_sMJoBd0tdXchFRHbQ/exec";
        
        let globalNegocioId = "";
        let globalTelefono = "";
        let globalMensaje = "";

        async function verificarCupon() {
            const urlParams = new URLSearchParams(window.location.search);
            const negocio = urlParams.get('negocio');
            const container = document.getElementById('card-container');

            if (!negocio) {
                container.innerHTML = `<h3 style="color:#e74c3c;">Enlace inválido</h3><p>No se especificó ningún negocio.</p>`;
                return;
            }

            try {
                // Registrar escaneo/visita
                const response = await fetch(`${API_URL}?negocio=${negocio}&accion=visita`);
                const result = await response.json();

                if (result.success) {
                    const n = result.data;
                    const isPagado = String(n.estatus).toLowerCase() === 'pagado';
                    
                    globalNegocioId = n.id;
                    globalTelefono = String(n.telefono).replace(/[^0-9]/g, '');
                    globalMensaje = encodeURIComponent(`¡Hola! Vi la promoción "${n.descripcion}" en Cupun y quiero hacer válido mi cupón con código: ${n.codigoUnico}`);

                    let botonWhatsAppHTML = '';
                    if (isPagado && n.telefono) {
                        botonWhatsAppHTML = `<button onclick="registrarClicWhatsApp()" class="btn-wa">💬 Reclamar Cupón por WhatsApp</button>`;
                    }

                    container.className = `card ${isPagado ? 'valid' : 'invalid'}`;
                    container.innerHTML = `
                        <h2>${isPagado ? '🎫 ¡Cupón Válido!' : '❌ Cupón Inactivo'}</h2>
                        <div class="badge ${isPagado ? 'badge-valid' : 'badge-invalid'}">
                            ${isPagado ? 'Afiliado Verificado Cupun' : 'Suscripción Vencida'}
                        </div>
                        <h3 style="margin:5px 0; color:#0f172a;">${n.nombre}</h3>
                        <p style="color:#64748b; font-size:14px; text-transform: uppercase;">${n.segmento}</p>
                        <hr style="border:0; border-top:1px solid #f1f5f9; margin:15px 0;">
                        <p style="font-size:14px; color:#334155;"><strong>Promoción:</strong> ${n.descripcion}</p>
                        <p style="font-size:12px; color:#94a3b8;">Vigencia: ${n.vigencia}</p>
                        <div class="code-box">
                            Código único: <br><span style="color:#2563eb; font-size:18px;">${n.codigoUnico}</span>
                        </div>
                        ${botonWhatsAppHTML}
                    `;
                } else {
                    container.innerHTML = `<h3 style="color:#e74c3c;">Negocio no encontrado</h3><p>El identificador no existe en el directorio.</p>`;
                }
            } catch (error) {
                container.innerHTML = `<h3 style="color:#e74c3c;">Error de conexión</h3><p>No se pudo contactar al servidor de validación.</p>`;
            }
        }

        // Función segura para registrar el clic antes de abrir WhatsApp
        async function registrarClicWhatsApp() {
            const btn = document.querySelector('.btn-wa');
            btn.innerText = "Registrando y abriendo...";
            btn.disabled = true;

            try {
                // Esperamos a que Google Sheets reciba y guarde el clic obligatoriamente
                await fetch(`${API_URL}?negocio=${globalNegocioId}&accion=clic`);
            } catch (e) {
                console.log("Error registrando clic, procediendo a abrir WhatsApp.");
            }
            
            // Abrimos WhatsApp de forma segura
            window.location.href = `https://wa.me/${globalTelefono}?text=${globalMensaje}`;
        }

        verificarCupon();
    </script>
</body>
</html>
