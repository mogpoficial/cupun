<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupun - Validación de Cupones</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; box-sizing: border-box; }
        .valid { border-top: 6px solid #2ecc71; }
        .invalid { border-top: 6px solid #e74c3c; }
        h2 { margin-top: 10px; font-size: 22px; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
        .badge-valid { background: #e8f8f5; color: #27ae60; }
        .badge-invalid { background: #ffd2d2; color: #c0392b; }
        .code-box { background: #f8f9fa; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 8px; margin-top: 15px; font-weight: bold; color: #1e293b; }
        
        /* Estilos para el selector de fecha y botones */
        .booking-section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; margin-top: 15px; text-align: left; }
        .booking-section label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }
        .booking-inputs { display: flex; gap: 8px; }
        .booking-inputs input { width: 50%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        
        .btn-wa { display: block; background-color: #25d366; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; margin-top: 12px; width: 100%; box-sizing: border-box; font-size: 15px; text-align: center; transition: background 0.2s; }
        .btn-wa:hover { background-color: #20ba5a; }
        .btn-wa.reserve { background-color: #0284c7; } /* Azul elegante para distinguir la reserva */
        .btn-wa.reserve:hover { background-color: #0369a1; }
        
        .loading { font-size: 16px; color: #64748b; }
    </style>
</head>
<body>

    <div class="card" id="card-container">
        <div class="loading">Verificando estatus en Cupun...</div>
    </div>

    <script>
        // REEMPLAZA ESTA LÍNEA CON TU URL REAL DE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/library/d/1akOkuLqTOoOteqPDeRwmAcm66KclHoAbmIOup6qbq4-s4tw9OrXKzjLu/21";

        async function verificarCupon() {
            const urlParams = new URLSearchParams(window.location.search);
            const negocio = urlParams.get('negocio');
            const container = document.getElementById('card-container');

            if (!negocio) {
                container.innerHTML = `<h3 style="color:#e74c3c;">Enlace inválido</h3><p>No se especificó ningún negocio.</p>`;
                return;
            }

            try {
                const response = await fetch(`${API_URL}?negocio=${negocio}`);
                const result = await response.json();

                if (result.success) {
                    const n = result.data;
                    const isPagado = String(n.estatus).toLowerCase() === 'pagado';
                    
                    let interactivoHTML = '';
                    if (isPagado && n.telefono) {
                        const numLimpio = String(n.telefono).replace(/[^0-9]/g, '');
                        
                        interactivoHTML = `
                            <div class="booking-section">
                                <label>📅 ¿Deseas agendar fecha y hora? (Opcional)</label>
                                <div class="booking-inputs">
                                    <input type="date" id="cita-fecha">
                                    <input type="time" id="cita-hora">
                                </div>
                            </div>
                            <a href="#" id="btn-accion" class="btn-wa" onclick="enviarWhatsApp(event, '${numLimpio}', '${n.descripcion}', '${n.codigoUnico}')">
                                💬 Reclamar Cupón por WhatsApp
                            </a>
                        `;
                    }

                    container.className = `card ${isPagado ? 'valid' : 'invalid'}`;
                    container.innerHTML = `
                        <h2>${isPagado ? '🎫 ¡Cupón Válido!' : '❌ Cupón Inactivo'}</h2>
                        <div class="badge ${isPagado ? 'badge-valid' : 'badge-invalid'}">
                            ${isPagado ? 'Afiliado Verificado Cupun' : 'Suscripción Vencida'}
                        </div>
                        <h3 style="margin:5px 0; color:#0f172a;">${n.nombre}</h3>
                        <p style="color:#64748b; font-size:14px; text-transform: uppercase;">${n.segmento}</p>
                        <hr style="border:0; border-top:1px solid #f1f5f9; margin:15px 0;">
                        <p style="font-size:14px; color:#334155;"><strong>Promoción:</strong> ${n.descripcion}</p>
                        <p style="font-size:12px; color:#94a3b8;">Vigencia: ${n.vigencia}</p>
                        <div class="code-box">
                            Código único: <br><span style="color:#2563eb; font-size:18px;">${n.codigoUnico}</span>
                        </div>
                        ${interactivoHTML}
                    `;

                    // Si el usuario selecciona fecha/hora, el botón cambia dinámicamente de texto y color
                    if (isPagado && n.telefono) {
                        const fechaInput = document.getElementById('cita-fecha');
                        const horaInput = document.getElementById('cita-hora');
                        const btnAccion = document.getElementById('btn-accion');

                        const actualizarBoton = () => {
                            if (fechaInput.value || horaInput.value) {
                                btnAccion.innerHTML = `📅 Reservar cita por WhatsApp`;
                                btnAccion.classList.add('reserve');
                            } else {
                                btnAccion.innerHTML = `💬 Reclamar Cupón por WhatsApp`;
                                btnAccion.classList.remove('reserve');
                            }
                        };

                        fechaInput.addEventListener('change', actualizarBoton);
                        horaInput.addEventListener('change', actualizarBoton);
                    }

                } else {
                    container.innerHTML = `<h3 style="color:#e74c3c;">Negocio no encontrado</h3><p>El identificador no existe en el directorio.</p>`;
                }
            } catch (error) {
                container.innerHTML = `<h3 style="color:#e74c3c;">Error de conexión</h3><p>No se pudo contactar al servidor de validación.</p>`;
            }
        }

        // Función que arma el mensaje dinámico para WhatsApp dependiendo de si eligió cita o solo cupón
        function enviarWhatsApp(event, telefono, descripcion, codigoUnico) {
            event.preventDefault();
            const fecha = document.getElementById('cita-fecha').value;
            const hora = document.getElementById('cita-hora').value;

            let mensaje = "";
            if (fecha || hora) {
                mensaje = `¡Hola! Vi la promoción "${descripcion}" en Cupun, mi código es ${codigoUnico} y quiero *reservar cita* para el día ${fecha || 'por definir'} a las ${hora || 'por definir'}.`;
            } else {
                mensaje = `¡Hola! Vi la promoción "${descripcion}" en Cupun y quiero hacer válido mi cupón con código: ${codigoUnico}`;
            }

            const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        verificarCupon();
    </script>
</body>
</html>
