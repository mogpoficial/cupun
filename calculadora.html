<!-- Agrega este bloque dentro de calculadora.html (oculto por defecto y visible solo si data.nivel === "MAX") -->
<div id="modulo-max-equilibrio" style="display:none; margin-top:24px; padding:18px; border-radius:16px; background:#FFF8F9; border:2px solid #EE3355;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="margin:0; color:#1E1E2C; font-size:17px;">📊 Punto de Equilibrio y Meta Diaria</h3>
    <span style="background:#EE3355; color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;">EXCLUSIVO MAX</span>
  </div>
  <p style="font-size:13px; color:#6C7280; margin-top:0;">Calcula cuántas ventas o servicios necesitas al mes y al día para cubrir tus gastos fijos y alcanzar tu meta.</p>

  <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Gastos fijos del mes (renta, luz, sueldos, internet) $</label>
  <input type="number" id="pe_gastos" placeholder="Ej. 12000" oninput="calcularPE()" style="width:100%; padding:10px; border-radius:8px; border:1px solid #D1D5DB; margin-bottom:10px;" />

  <label style="display:block; font-size:13px; font-weight:600; margin-bottom:4px;">Ganancia libre que quieres lograr al mes $</label>
  <input type="number" id="pe_meta" placeholder="Ej. 8000" oninput="calcularPE()" style="width:100%; padding:10px; border-radius:8px; border:1px solid #D1D5DB; margin-bottom:10px;" />

  <div style="display:flex; gap:10px; margin-bottom:12px;">
    <div style="flex:1;">
      <label style="display:block; font-size:12px; font-weight:600; margin-bottom:4px;">Ganancia por venta ($)</label>
      <input type="number" id="pe_utilidad_unit" placeholder="Ej. 85" oninput="calcularPE()" style="width:100%; padding:10px; border-radius:8px; border:1px solid #D1D5DB;" />
    </div>
    <div style="flex:1;">
      <label style="display:block; font-size:12px; font-weight:600; margin-bottom:4px;">Días que abres al mes</label>
      <input type="number" id="pe_dias" value="26" oninput="calcularPE()" style="width:100%; padding:10px; border-radius:8px; border:1px solid #D1D5DB;" />
    </div>
  </div>

  <div id="pe_resultado" style="background:#1E1E2C; color:#fff; padding:14px; border-radius:12px; font-size:14px; line-height:1.6;">
    Ingresa tus gastos fijos y ganancia por venta para ver tu meta diaria.
  </div>
</div>

<script>
  // Dentro de tu función donde validas la calculadora:
  // if (data.nivel === "MAX") { document.getElementById("modulo-max-equilibrio").style.display = "block"; }

  function calcularPE() {
    const gastos = parseFloat(document.getElementById("pe_gastos").value) || 0;
    const meta = parseFloat(document.getElementById("pe_meta").value) || 0;
    const utilidad = parseFloat(document.getElementById("pe_utilidad_unit").value) || 0;
    const dias = parseFloat(document.getElementById("pe_dias").value) || 26;
    const box = document.getElementById("pe_resultado");

    if (gastos <= 0 || utilidad <= 0) {
      box.innerHTML = "Ingresa tus gastos fijos y ganancia por venta para ver tu meta diaria.";
      return;
    }

    const ventasEquilibrioMes = Math.ceil(gastos / utilidad);
    const ventasEquilibrioDia = (ventasEquilibrioMes / dias).toFixed(1);
    const ventasMetaMes = Math.ceil((gastos + meta) / utilidad);
    const ventasMetaDia = (ventasMetaMes / dias).toFixed(1);

    box.innerHTML = `
      <div>⚖️ <b>Para salir tablas (Punto de Equilibrio):</b><br>Necesitas <b>${ventasEquilibrioMes} ventas al mes</b> (${ventasEquilibrioDia} al día).</div>
      ${meta > 0 ? `<div style="margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.15);">🚀 <b>Para lograr tu meta de $${meta.toLocaleString()}:</b><br>Necesitas <b>${ventasMetaMes} ventas al mes</b> (${ventasMetaDia} al día).</div>` : ""}
    `;
  }
</script>
